name: Sync on DOM Cloud DEV

on:
  workflow_dispatch: {}
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vite en el runner de DOM Cloud revienta por RAM (Wasm/undici). Se compila aquí.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend (GitHub runner)
        run: npm ci && npm run build

      - name: Deploy PHP/Laravel on DOM Cloud (webhook)
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploy
          webhook_secret: ${{ secrets.WEBHOOK_SECRET_DEV }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH_DEV }}
          data: >-
            {
              "commands": [
                "git fetch origin",
                "git checkout dev",
                "git reset --hard origin/dev",
                "git clean -fd",
                "composer install --no-interaction --prefer-dist --optimize-autoloader",
                "php artisan vendor:publish --tag=filament-config --force",
                "php artisan vendor:publish --tag=filament-general-settings-views --force",
                "php artisan migrate --force",
                "php artisan cache:forget general_settings",
                "php artisan optimize:clear",
                "php artisan config:cache",
                "php artisan route:cache",
                "php artisan view:cache",
                "php artisan optimize",
                "php artisan queue:restart",
                "php artisan schedule:run",
                "restart",
                "php artisan vendor:publish --tag=livewire:assets --force"
              ]
            }

      # Requiere en GitHub → Settings → Secrets: DOMCLOUD_DEV_SSH_KEY, DOMCLOUD_DEV_SSH_HOST,
      # DOMCLOUD_DEV_SSH_USER, DOMCLOUD_DEV_BUILD_PATH (ej. /home/gruponauticadev/public_html/public/build/)
      - name: Rsync public/build to DOM Cloud
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOMCLOUD_DEV_SSH_KEY }}
          HOST: ${{ secrets.DOMCLOUD_DEV_SSH_HOST }}
          USER: ${{ secrets.DOMCLOUD_DEV_SSH_USER }}
          REMOTE_DIR: ${{ secrets.DOMCLOUD_DEV_BUILD_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo "::error::Define secrets DOMCLOUD_DEV_SSH_KEY, DOMCLOUD_DEV_SSH_HOST, DOMCLOUD_DEV_SSH_USER, DOMCLOUD_DEV_BUILD_PATH (ruta remota de public/build/, con slash final)."
            exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/domcloud_dev_ed25519
          chmod 600 ~/.ssh/domcloud_dev_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/domcloud_dev_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            public/build/ "${USER}@${HOST}:${REMOTE_DIR}"
          rm -f ~/.ssh/domcloud_dev_ed25519
