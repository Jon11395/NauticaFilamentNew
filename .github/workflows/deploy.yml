name: Sync on DOM Cloud PROD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend (GitHub runner)
        run: npm ci && npm run build

      - name: Deploy PHP/Laravel on DOM Cloud (webhook)
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploy
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH }}
          data: >-
            {
              "commands": [
                "git reset --hard",
                "git clean -fd",
                "git pull",
                "composer install --no-interaction --prefer-dist --optimize-autoloader",
                "php artisan migrate --force",
                "php artisan config:cache",
                "php artisan route:cache",
                "php artisan view:cache",
                "php artisan queue:restart",
                "php artisan schedule:run",
                "restart",
                "php artisan vendor:publish --tag=livewire:assets --force"
              ]
            }

      # Secrets: DOMCLOUD_PROD_SSH_KEY, DOMCLOUD_PROD_SSH_HOST, DOMCLOUD_PROD_SSH_USER,
      # DOMCLOUD_PROD_BUILD_PATH (ej. /home/gruponautica/public_html/public/build/)
      - name: Rsync public/build to DOM Cloud
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOMCLOUD_PROD_SSH_KEY }}
          HOST: ${{ secrets.DOMCLOUD_PROD_SSH_HOST }}
          USER: ${{ secrets.DOMCLOUD_PROD_SSH_USER }}
          REMOTE_DIR: ${{ secrets.DOMCLOUD_PROD_BUILD_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo "::error::Define secrets DOMCLOUD_PROD_SSH_KEY, DOMCLOUD_PROD_SSH_HOST, DOMCLOUD_PROD_SSH_USER, DOMCLOUD_PROD_BUILD_PATH."
            exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/domcloud_prod_ed25519
          chmod 600 ~/.ssh/domcloud_prod_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/domcloud_prod_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            public/build/ "${USER}@${HOST}:${REMOTE_DIR}"
          rm -f ~/.ssh/domcloud_prod_ed25519
