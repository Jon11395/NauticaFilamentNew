name: Sync on DOM Cloud PROD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node en DOM Cloud tiene poca RAM; npm install OOM sin NODE_OPTIONS + npm ci.
      # Si aún falla, prueba 1024 en lugar de 2048 o sube RAM en el panel de DOM Cloud.
      - name: Invoke deployment hook
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploy
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH }}
          data: >-
            {
              "commands": [
                "git reset --hard",
                "git clean -fd",
                "git pull",
                "composer install --no-interaction --prefer-dist --optimize-autoloader",
                "export NODE_OPTIONS='--max-old-space-size=2048' npm_config_maxsockets=2 && npm ci --no-audit --no-fund && npm run build",
                "php artisan migrate --force",
                "php artisan config:cache",
                "php artisan route:cache",
                "php artisan view:cache",
                "php artisan queue:restart",
                "php artisan schedule:run",
                "restart",
                "php artisan vendor:publish --tag=livewire:assets --force"
              ]
            }

   
